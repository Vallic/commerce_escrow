commerce_escrow.webhook:
  path: '/payment/webhook/escrow/{token}'
  defaults:
    _controller: '\Drupal\commerce_escrow\Controller\EscrowController::webhook'
    _title: 'Webhook'
  methods: [POST]
  requirements:
    _custom_access: '\Drupal\commerce_escrow\Controller\EscrowController::access'
    token: '[A-Za-z0-9_-]+'

commerce_escrow.settings:
  path: '/admin/commerce/config/payment/escrow'
  defaults:
    _form: '\Drupal\commerce_escrow\Form\EscrowSettingsForm'
    _title: 'Escrow settings'
  requirements:
    _permission: 'administer commerce_payment_gateway'
